services:
  favorites-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopify-favorites-sync
    restart: unless-stopped
    # No published port: public traffic comes only through Traefik (HTTPS).
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    networks:
      - favorites-network
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      # https://srv1009578.hstgr.cloud/vev/... -> this app (prefix removed).
      # Priority keeps it ahead of the n8n router on the same host.
      - "traefik.http.routers.vev-app.rule=Host(`srv1009578.hstgr.cloud`) && PathPrefix(`/vev`)"
      - "traefik.http.routers.vev-app.entrypoints=websecure"
      - "traefik.http.routers.vev-app.tls=true"
      - "traefik.http.routers.vev-app.tls.certresolver=le-http"
      - "traefik.http.routers.vev-app.priority=1000"
      - "traefik.http.routers.vev-app.middlewares=vev-app-strip"
      - "traefik.http.middlewares.vev-app-strip.stripprefix.prefixes=/vev"
      - "traefik.http.services.vev-app.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  favorites-network:
    driver: bridge
  traefik-network:
    external: true
